# 应用日志轮转（Linux）
# 安装：cp logrotate-yunqi.conf /etc/logrotate.d/yunqi
# 校验：logrotate -d /etc/logrotate.d/yunqi

/var/log/yunqi/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}

# 使用发行版 nginx 包时，/var/log/nginx/*.log 通常已有系统自带规则，无需重复配置。
