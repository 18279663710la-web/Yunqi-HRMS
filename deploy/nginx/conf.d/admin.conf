# 管理后台入口（IP + 端口）
# 浏览器访问：http://服务器IP:8080
# Windows 10 部署示例；Linux 部署把 root 改为 /srv/yunqi/web/dist
# 静态文件来自 web 构建产物，接口转发给本机 Express（127.0.0.1:3100）。

server {
    listen 8080;
    server_name _;

    root C:/yunqi/web/dist;
    index index.html;

    # 仅内网访问时按实际网段放开，公网部署不建议直接暴露该端口。
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 工资表 PDF、AI 建议等接口耗时可能较长
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 健康检查（服务端根路径，不在 /api 下）
    location = /health {
        proxy_pass http://127.0.0.1:3100/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态资源长期缓存，入口页不缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # React 单页路由回退，刷新子页面不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
